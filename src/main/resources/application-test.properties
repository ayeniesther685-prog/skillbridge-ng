spring.datasource.url=jdbc:postgresql://localhost:5432/skillbridge_test
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

app.jwt.secret=test-secret-test-secret-test-secret-test-secret-1234567890
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=604800
app.jwt.issuer=skillbridge-test