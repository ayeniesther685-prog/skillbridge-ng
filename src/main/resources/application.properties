# ===== Server =====
server.port=8081

# ===== App =====
spring.application.name=skillbridge

# ===== DataSource (local PostgreSQL 16) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/skillbridge
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===== OpenAPI / Swagger =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== JWT =====
app.jwt.secret=SkillBridgeNG_JWT_Secret_2026_Secure_Key_9x7K2m
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
app.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
app.jwt.issuer=skillbridge

# ===== Logging =====
logging.level.org.skillbridge=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO